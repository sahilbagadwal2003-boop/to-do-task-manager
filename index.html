<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist To-Do List</title>
  <meta name="description" content="A sleek, modern, and aesthetic To-Do List application built with HTML, CSS, and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="todo-wrapper">
    <header class="app-header">
      <div class="header-top">
        <span class="badge" id="current-date">Today</span>
        <span class="counter" id="task-counter">0 tasks remaining</span>
      </div>
      <h1 class="app-title">Daily Focus</h1>
      <p class="app-subtitle">Capture your thoughts and accomplish your goals.</p>
    </header>

    <section class="input-card">
      <form id="todo-form" class="todo-form" autocomplete="off">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <input 
            type="text" 
            id="todo-input" 
            placeholder="What needs to be done today?" 
            maxlength="120"
            required
            aria-label="New task input"
          />
        </div>
        <!-- Single button to add the input as requested -->
        <button type="submit" id="add-task-btn" class="btn-add" aria-label="Add Task">
          <svg class="plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Task</span>
        </button>
      </form>
    </section>

    <section class="list-card">
      <ul id="todo-list" class="todo-list" aria-live="polite">
        <!-- Dynamic task items will be inserted here -->
      </ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h2 class="empty-title">All caught up!</h2>
        <p class="empty-desc">No tasks on your list. Add one above to get started.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
